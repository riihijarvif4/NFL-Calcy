<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomminvarmat - NFL-Calcy (Opta Engine)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pomminvarmat 🏈💣</h1>
        <p class="subtitle">"Opta-tason tekoäly" – Puhelinystävällinen fantasy- & ottelulaskuri</p>

        <div class="card">
            <h2>Valitse vastakkaiset joukkueet</h2>
            <div class="select-group">
                <label for="homeTeam">Kotijoukkue (Kotietu aktiivinen 🏠):</label>
                <select id="homeTeam"></select>
            </div>
            <div class="select-group">
                <label for="awayTeam">Vierasjoukkue ✈️:</label>
                <select id="awayTeam"></select>
            </div>
            <button id="calcBtn" class="meme-btn">SUORITA MONTE CARLO -SIMULAATIO 🚀🔥</button>
        </div>

        <div id="teamConfigs" class="config-grid">
            <!-- Pelaajien poistoruksit generoidaan dynaamisesti tänne -->
        </div>

        <div id="results" class="results-container" style="display:none;">
            <!-- Tulokset ja Opta-analyysit ilmestyvät tänne -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
