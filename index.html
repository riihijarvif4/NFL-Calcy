<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL-Calcy - Meemiversio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏈 NFL-Calcy: Meemi & TD-Laskuri 🤡</h1>
        <p class="subtitle">"Missä Tom Brady?" – Puhelinystävällinen fantasy-työkalu</p>

        <div class="card">
            <h2>Valitse vastakkaiset joukkueet</h2>
            <div class="select-group">
                <label for="homeTeam">Kotijoukkue:</label>
                <select id="homeTeam"></select>
            </div>
            <div class="select-group">
                <label for="awayTeam">Vierasjoukkue:</label>
                <select id="awayTeam"></select>
            </div>
            <button id="calcBtn" class="meme-btn">LAITA MATSI TULILLE 🚀🔥</button>
        </div>

        <div id="teamConfigs" class="config-grid">
            <!-- Pelaajien poistoruksit generoidaan tähän -->
        </div>

        <div id="results" class="results-container" style="display:none;">
            <!-- Tulokset ja meemit ilmestyvät tänne -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
