<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL H2H - Otteluvertailu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="referee-stripe"></div>

    <header class="app-header">
        <h1>🏈 NFL H2H <span>Otteluanalysaattori</span></h1>
        <p>Valitse viikko ja ottelupari – Poisson-jakauma & True Odds -laskenta</p>
    </header>

    <main class="main-container">
        <!-- Valintapaneeli: Viikko ja Ottelu -->
        <section class="selection-panel">
            <div class="select-box">
                <label for="weekSelect">📅 Valitse Viikko</label>
                <select id="weekSelect">
                    <option value="4" selected>Viikko 4</option>
                </select>
            </div>

            <div class="select-box">
                <label for="matchSelect">⚔️ Valitse Ottelupari</label>
                <select id="matchSelect"></select>
            </div>

            <button id="compareBtn" class="btn-primary">Vertaile</button>
        </section>

        <!-- Vertailunäkymä -->
        <section class="h2h-container">
            <!-- Kotijoukkue -->
            <div class="team-card">
                <h2 id="homeTitle">Kotijoukkue</h2>
                <div class="team-stats" id="homeStats"></div>
                <h3>Avainpelaajat & Poisson TD %</h3>
                <div class="players-list" id="homePlayers"></div>
            </div>

            <!-- Keskusta (Tulosarvio & Todennäköisyys) -->
            <div class="center-card">
                <div class="matchup-score-box">
                    <span id="homeScoreNum">--</span>
                    <span class="score-dash">-</span>
                    <span id="awayScoreNum">--</span>
                </div>
                <div class="win-prob-display">
                    <div id="homeWinProb">Kotijoukkue: --%</div>
                    <div class="prob-bar-container">
                        <div id="probBar" class="prob-bar"></div>
                    </div>
                    <div id="awayWinProb">Vierasjoukkue: --%</div>
                </div>
            </div>

            <!-- Vierasjoukkue -->
            <div class="team-card">
                <h2 id="awayTitle">Vierasjoukkue</h2>
                <div class="team-stats" id="awayStats"></div>
                <h3>Avainpelaajat & Poisson TD %</h3>
                <div class="players-list" id="awayPlayers"></div>
            </div>
        </section>
    </main>

    <div class="referee-stripe"></div>
    <script src="script.js"></script>
</body>
</html>
